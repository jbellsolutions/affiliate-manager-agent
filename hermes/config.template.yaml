# Secret-free Hermes v0.21.0 configuration seed for the hosted Affiliate Manager.
# new-agent.sh renders the placeholders into the private deployment directory.

model:
  default: accounts/fireworks/models/deepseek-v4-pro
  provider: custom
  base_url: https://api.fireworks.ai/inference/v1
  key_env: FIREWORKS_API_KEY

fallback_providers:
- provider: custom
  model: deepseek-ai/DeepSeek-V4-Pro
  base_url: https://api.together.xyz/v1
  key_env: TOGETHER_API_KEY
# __OPENROUTER_FALLBACK_START__
- provider: custom
  model: deepseek/deepseek-v4-pro
  base_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY
# __OPENROUTER_FALLBACK_END__

toolsets:
  - hermes-cli

agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 3
  tool_use_enforcement: auto
  reasoning_effort: medium
  verify_on_stop: true

terminal:
  backend: local
  cwd: .
  timeout: 180
  persistent_shell: true
  lifetime_seconds: 300

browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: false
  auto_local_for_private_urls: true

checkpoints:
  enabled: true
  max_snapshots: 50
  retention_days: 7
  delete_orphans: true

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  tail_mode: lean

skills:
  creation_nudge_interval: 15
  write_approval: true
  guard_agent_created: true

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6

delegation:
  model: accounts/fireworks/models/deepseek-v4-pro
  provider: custom
  base_url: https://api.fireworks.ai/inference/v1
  key_env: FIREWORKS_API_KEY
  inherit_mcp_toolsets: true
  max_iterations: 50
  child_timeout_seconds: 600
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: true
  subagent_auto_approve: false

display:
  personality: __AGENT_PERSONA__
  theme: midnight
  streaming: true
  interim_assistant_messages: true
  tool_progress: all
  show_reasoning: false
  show_cost: false

privacy:
  redact_pii: true

approvals:
  mode: manual
  timeout: 120
  cron_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true

hooks_auto_accept: false

security:
  allow_private_urls: false
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: false

tool_loop_guardrails:
  hard_stop_enabled: true

cron:
  wrap_response: true

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60

code_execution:
  mode: project
  timeout: 300
  max_tool_calls: 50

sessions:
  auto_prune: false
  retention_days: 90
  vacuum_after_prune: true

session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4

group_sessions_per_user: true

platforms:
  slack:
    enabled: __SLACK_ENABLED__
  telegram:
    enabled: __TELEGRAM_ENABLED__

platform_toolsets:
  cli: [hermes-cli]
  telegram: [hermes-telegram, browser, clarify, code_execution, computer_use, cronjob, delegation, file, kanban, memory, session_search, skills, terminal, todo, vision, web]
  slack: [hermes-slack, browser, clarify, code_execution, computer_use, cronjob, delegation, file, kanban, memory, session_search, skills, terminal, todo, vision, web]

TELEGRAM_HOME_CHANNEL: '__TELEGRAM_HOME_CHANNEL__'
SLACK_HOME_CHANNEL: '__SLACK_HOME_CHANNEL__'
